<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Login/Register</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f2f5;}
    .container{position:relative;width:800px;height:500px;background:#fff;border-radius:15px;box-shadow:0 0 25px rgba(0,0,0,0.1);overflow:hidden;}
    .form-container{position:absolute;top:0;height:100%;transition:all 0.6s ease-in-out;}
    .sign-up{left:0;width:50%;opacity:0;z-index:1;}
    .sign-in{left:0;width:50%;z-index:2;}
    form{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 50px;height:100%;text-align:center;}
    h1{margin-bottom:20px;}
    input{margin:8px 0;padding:12px;width:100%;border:1px solid #ccc;border-radius:8px;}
    button{margin-top:15px;padding:12px 40px;border:none;border-radius:8px;background:#5a88f5;color:#fff;font-size:16px;cursor:pointer;}
    .overlay-container{position:absolute;top:0;left:50%;width:50%;height:100%;overflow:hidden;transition:transform 0.6s ease-in-out;z-index:100;}
    .overlay{background:#5a88f5;color:#fff;position:relative;left:-100%;height:100%;width:200%;transform:translateX(0);transition:transform 0.6s ease-in-out;display:flex;align-items:center;justify-content:center;}
    .overlay-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;width:50%;transition:0.6s;}
    .overlay-left{transform:translateX(-20%);}
    .overlay-right{right:0;transform:translateX(0);}
    .container.right-panel-active .sign-in{transform:translateX(100%);}
    .container.right-panel-active .sign-up{transform:translateX(100%);opacity:1;z-index:5;}
    .container.right-panel-active .overlay-container{transform:translateX(-100%);}
    .container.right-panel-active .overlay{transform:translateX(50%);}
  </style>
</head>
<body>
  <div class="container" id="container">
    <!-- Sign Up -->
    <div class="form-container sign-up">
      <form>
        <h1>Create Account</h1>
        <input type="text" placeholder="Name"/>
        <input type="email" placeholder="Email"/>
        <input type="password" placeholder="Password"/>
       <a href="index4.html" 
   target="_blank"
   style="display:inline-block; padding:10px 20px; background:#007BFF; color:#fff; text-decoration:none; border-radius:5px;">
  Sign up
</a>
      </form>
    </div>
    <h4>Forget your login details?

    <!-- Sign In -->
    <div class="form-container sign-in">
      <form>
        <h1>Sign In</h1>
        <input type="email" placeholder="Email"/>
        <input type="password" placeholder="Password"/>
        <a href="index4.html" 
   target="_blank"
   style="display:inline-block; padding:10px 20px; background:#007BFF; color:#fff; text-decoration:none; border-radius:5px;">
  Sign in
</a>
      </form>
    </div>

    <!-- Overlay -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h1>Welcome Back!</h1>
          <p>Already have an account?</p>
          <button class="ghost" id="signIn">Sign In</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h1>Hello, Friend!</h1>
          <p>Don’t have an account yet?</p>
          <button class="ghost" id="signUp">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    document.getElementById('signUp').addEventListener('click',()=>container.classList.add("right-panel-active"));
    document.getElementById('signIn').addEventListener('click',()=>container.classList.remove("right-panel-active"));
  </script>
</body>
</html>
