<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prashiskshan</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 60px;
      background: #fff;
      position: fixed;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #000;
      font-size: 15px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #007bff;
    }

    /* Dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 25px;
      left: 0;
      background: #fff;
      min-width: 150px;
      border: 1px solid #ddd;
      z-index: 999;
    }

    .dropdown-content li {
      padding: 10px;
    }

    .dropdown-content li a {
      color: #000;
      display: block;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Hero Section with Background Image */
    .hero {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 70px;
    }

    .hero-content {
      text-align: center;
      color: #000;
      background: rgba(255, 255, 255, 0.7);
      padding: 40px;
      border-radius: 10px;
    }

    .hero-content h1 span {
      color: #007bff;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #007bff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    /* Scroll Button */
    #scrollBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }

    #scrollBtn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Prashiskshan</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li class="dropdown">
          <a href="#">Downloads ▾</a>
          <ul class="dropdown-content">
            <li><a href="#">Forms</a></li>
            <li><a href="#">Circulars</a></li>
            <li><a href="#">Others</a></li>
          </ul>
        </li>
        <li class="dropdown">
          <a href="#">CE/PAC Guidelines ▾</a>
          <ul class="dropdown-content">
            <li><a href="#">PAC</a></li>
            <li><a href="#">CE</a></li>
          </ul>
        </li>
        <li><a href="#">Regulations & Syllabus</a></li>
        <li><a href="#">Notification & Timetable</a></li>
        <li><a href="#">Degree Verification</a></li>
        <li><a href="#">Results</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2>Welcome to</h2>
      <h1><span>Prashiskshan-an app for Academica interface</span></h1>
        <a href="login.html" 
   target="_blank"
   style="display:inline-block; padding:10px 20px; background:#007BFF; color:#fff; text-decoration:none; border-radius:5px;">
  Login
</a>
    </div>
  </section>

  <!-- Scroll Button -->
  <button onclick="scrollToTop()" id="scrollBtn">↑</button>

  <script>
    // Scroll to top button
    let scrollBtn = document.getElementById("scrollBtn");

    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        scrollBtn.style.display = "block";
      } else {
        scrollBtn.style.display = "none";
      }
    };

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>

</body>
</html>
